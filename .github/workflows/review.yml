name: Review

# Trusted tests + gates + blocking code review for every push to dev (owner 11-11: one shared `dev` branch; hotfixes
# straight onto main with a `Hotfix: <why>` trailer; review fixes on devfix/<sha>). Since 11-13 the whole flow is
# yidongw/sheepdog's reusable workflow, pinned by a full commit sha below (docs: github.com/yidongw/sheepdog,
# docs/contract.md). Driven on the dispatcher host by sheepdog's scripts/ci/review-dispatch.sh with
# REPO=yidongw/discord-ai-terminal (timer discord-ai-terminal-review-dispatch); deploys by the host autodeploy.
#
# Trust model: workflow_run always runs THIS file as it is on main, so a branch cannot change what tests or reviews it.
# The pushed commit is checked out as data in the review job; its code runs only in the tests job (InstaBox VM, as a
# throwaway user: .github/sheepdog/tests.sh). A main head (Hotfix: / Train-Merge: / Review-Fix-Of:) is titled
# `recheck <sha>`, a dev/devfix head `review <sha>` — the verdict readers find runs by these titles.
#
# Runners (GitHub-hosted minutes are not paid): `tests` on instabox-discord-ai-terminal (InstaBox VM sandbox; no
# unreviewed code runs where the bot runs), `review` + `status` on the A1 review runner (labels a1,
# discord-ai-terminal-review).
run-name: ${{ github.event.workflow_run.head_branch == 'main' && 'recheck' || 'review' }} ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [requested]

permissions:
  contents: read
  statuses: write
  actions: read

concurrency:
  # dev: a running review is not cancelled by a newer dev push (merge train); main: one group per sha.
  group: review-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.run_attempt }}${{ github.event.workflow_run.head_branch != 'dev' && format('-{0}', github.event.workflow_run.head_sha) || '' }}
  cancel-in-progress: ${{ github.event.workflow_run.head_branch != 'dev' }}

jobs:
  sheepdog:
    uses: yidongw/sheepdog/.github/workflows/review.yml@411ae040d3a03eda3aa58b70f28aaab1f2154468
    with:
      tests-runs-on: '["self-hosted","instabox","discord-ai-terminal-tests"]'   # back from A1 (11-12): 3 tests fail there in beforeEach, cause unknown
      review-runs-on: '["self-hosted","a1","discord-ai-terminal-review"]'
      tests-timeout-minutes: 20
      node-version: ""
      bun-version: "1.4.2" # what the bot runs with (/usr/local/bin/bun)
      open-findings-file: /home/ubuntu/.local/state/discord-ai-terminal-review-dispatch/open-findings.log
